# Root pytest configuration.
#
# WHY THIS FILE EXISTS. The API's own pytest settings live in services/api/pyproject.toml, and
# pytest only reads those when its rootdir IS services/api. CI runs `pytest services/api`, so
# it was always green -- but anyone who cloned the repo and ran plain `pytest` at the root got
# fifteen failures reading "async def functions are not natively supported", because
# asyncio_mode never took effect. A newcomer's reasonable first command reported the project
# as broken while CI reported it as fine.
#
# Keep asyncio_mode in step with services/api/pyproject.toml.
[pytest]
testpaths = services/api/tests
addopts = -q
asyncio_mode = auto
